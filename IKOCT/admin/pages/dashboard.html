<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashboard — IKOCT Admin</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="stylesheet" href="../styles/admin.css" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
<div class="admin-shell">
  <nav class="admin-sidebar" id="adminSidebar"></nav>
  <main class="admin-main">
    <div class="admin-topbar"><h2>Overview</h2></div>
    <div id="statsGrid" style="display:grid; grid-template-columns: repeat(auto-fit, minmax(180px,1fr)); gap:16px;"></div>

    <div class="card" style="margin-top:8px;">
      <h3 style="margin-top:0;">Quick actions</h3>
      <a href="manage.html?resource=events&new=1" class="btn btn-primary">+ Add Event</a>
      <a href="manage.html?resource=news&new=1" class="btn btn-secondary">+ Add News</a>
      <a href="messages.html" class="btn btn-secondary">View Messages</a>
    </div>
  </main>
</div>

<script src="../scripts/api.js"></script>
<script src="../scripts/auth-guard.js"></script>
<script src="../scripts/shell.js"></script>
<script>
  renderAdminShell('dashboard');

  const resources = [
    { key: 'events', label: 'Events' },
    { key: 'news', label: 'News' },
    { key: 'blog', label: 'Blog Posts' },
    { key: 'stories', label: 'Stories' },
    { key: 'programs', label: 'Programs' },
    { key: 'projects', label: 'Projects' },
    { key: 'gallery', label: 'Gallery Images' },
  ];

  async function loadStats() {
    const grid = document.getElementById('statsGrid');
    grid.innerHTML = resources.map((r) => `
      <div class="card" style="text-align:center;">
        <div style="font-size:1.8rem; font-weight:700; color:var(--ikoct-primary);" id="count-${r.key}">–</div>
        <div style="color:var(--ikoct-text-muted); font-size:0.85rem;">${r.label}</div>
      </div>
    `).join('');

    for (const r of resources) {
      try {
        const { data } = await IkoctAPI.list(r.key);
        document.getElementById(`count-${r.key}`).textContent = data.length;
      } catch {
        document.getElementById(`count-${r.key}`).textContent = '—';
      }
    }

    try {
      const { data: messages } = await IkoctAPI.contactMessages();
      const unread = messages.filter((m) => !m.is_read).length;
      if (unread > 0) {
        grid.insertAdjacentHTML('beforeend', `
          <div class="card" style="text-align:center; border-color:var(--ikoct-accent);">
            <div style="font-size:1.8rem; font-weight:700; color:var(--ikoct-danger);">${unread}</div>
            <div style="color:var(--ikoct-text-muted); font-size:0.85rem;">Unread Messages</div>
          </div>
        `);
      }
    } catch {}
  }

  loadStats();
</script>
</body>
</html>
