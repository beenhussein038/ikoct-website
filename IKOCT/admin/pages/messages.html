<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Messages — IKOCT Admin</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="stylesheet" href="../styles/admin.css" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
<div class="admin-shell">
  <nav class="admin-sidebar" id="adminSidebar"></nav>
  <main class="admin-main">
    <div class="admin-topbar"><h2>Contact Messages</h2></div>
    <div id="alertBox"></div>
    <div class="card"><div id="wrap"><p class="empty-state">Loading…</p></div></div>
  </main>
</div>

<script src="../scripts/api.js"></script>
<script src="../scripts/auth-guard.js"></script>
<script src="../scripts/shell.js"></script>
<script>
  renderAdminShell('messages');

  function showAlert(msg, type = 'error') {
    document.getElementById('alertBox').innerHTML = `<div class="alert alert-${type === 'error' ? 'error' : 'success'}">${msg}</div>`;
    setTimeout(() => (document.getElementById('alertBox').innerHTML = ''), 4000);
  }

  async function load() {
    const wrap = document.getElementById('wrap');
    try {
      const { data } = await IkoctAPI.contactMessages();
      if (data.length === 0) {
        wrap.innerHTML = '<div class="empty-state">No messages yet.</div>';
        return;
      }
      wrap.innerHTML = data
        .map(
          (m) => `
        <div class="card" style="${m.is_read ? '' : 'border-left:3px solid var(--ikoct-accent);'}">
          <div style="display:flex; justify-content:space-between;">
            <strong>${m.name}</strong>
            <span style="color:var(--ikoct-text-muted); font-size:0.8rem;">${new Date(m.created_at).toLocaleString()}</span>
          </div>
          <div style="color:var(--ikoct-text-muted); font-size:0.85rem; margin-bottom:8px;">
            ${m.email}${m.phone ? ' · ' + m.phone : ''}${m.subject ? ' · ' + m.subject : ''}
          </div>
          <p style="margin:0 0 12px;">${m.message}</p>
          <button class="btn btn-secondary" style="padding:5px 10px; font-size:0.8rem;" data-read="${m.id}" ${m.is_read ? 'disabled' : ''}>${m.is_read ? 'Read' : 'Mark as read'}</button>
          <button class="btn btn-danger" style="padding:5px 10px; font-size:0.8rem;" data-del="${m.id}">Delete</button>
        </div>`
        )
        .join('');

      wrap.querySelectorAll('[data-read]').forEach((btn) =>
        btn.addEventListener('click', async () => {
          await IkoctAPI.markMessageRead(btn.dataset.read);
          load();
        })
      );
      wrap.querySelectorAll('[data-del]').forEach((btn) =>
        btn.addEventListener('click', async () => {
          if (!confirm('Delete this message?')) return;
          await IkoctAPI.deleteMessage(btn.dataset.del);
          showAlert('Deleted.', 'success');
          load();
        })
      );
    } catch (err) {
      wrap.innerHTML = `<div class="alert alert-error">${err.message}</div>`;
    }
  }
  load();
</script>
</body>
</html>
