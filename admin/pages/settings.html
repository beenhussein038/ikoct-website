<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Site Settings — IKOCT Admin</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="stylesheet" href="../styles/admin.css" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
<div class="admin-shell">
  <nav class="admin-sidebar" id="adminSidebar"></nav>
  <main class="admin-main">
    <div class="admin-topbar"><h2>Site Settings</h2></div>
    <div id="alertBox"></div>
    <div class="card">
      <p style="color:var(--ikoct-text-muted); font-size:0.88rem; margin-top:0;">
        These values are used across the public website (contact details, social links). Secret API keys (Paystack secret key etc.) are never stored here — those live only in the backend's <code>.env</code> file.
      </p>
      <form id="settingsForm"></form>
      <button class="btn btn-primary" id="saveBtn" style="margin-top:10px;">Save Settings</button>
    </div>
  </main>
</div>

<script src="../scripts/api.js"></script>
<script src="../scripts/auth-guard.js"></script>
<script src="../scripts/shell.js"></script>
<script>
  renderAdminShell('settings');

  const FIELDS = [
    { key: 'org_phone', label: 'Organization Phone' },
    { key: 'org_email', label: 'Organization Email' },
    { key: 'org_address', label: 'Organization Address' },
    { key: 'facebook_url', label: 'Facebook URL' },
    { key: 'twitter_url', label: 'Twitter / X URL' },
    { key: 'instagram_url', label: 'Instagram URL' },
    { key: 'paystack_public_key', label: 'Paystack Public Key (safe to expose publicly)' },
  ];

  function showAlert(msg, type = 'error') {
    document.getElementById('alertBox').innerHTML = `<div class="alert alert-${type === 'error' ? 'error' : 'success'}">${msg}</div>`;
    setTimeout(() => (document.getElementById('alertBox').innerHTML = ''), 4000);
  }

  async function load() {
    try {
      const { data } = await IkoctAPI.request ? {} : {};
    } catch {}
  }

  async function init() {
    const form = document.getElementById('settingsForm');
    let existing = {};
    try {
      const res = await fetch(`${window.IKOCT_API_BASE_URL || 'http://localhost:4000/api'}/settings`, {
        headers: { Authorization: `Bearer ${IkoctAPI.getToken()}` },
      });
      const json = await res.json();
      existing = json.data || {};
    } catch {}

    form.innerHTML = FIELDS.map(
      (f) => `<div class="form-group"><label>${f.label}</label><input id="s_${f.key}" value="${existing[f.key] || ''}" /></div>`
    ).join('');
  }

  document.getElementById('saveBtn').addEventListener('click', async () => {
    const btn = document.getElementById('saveBtn');
    btn.disabled = true;
    btn.textContent = 'Saving…';
    try {
      for (const f of FIELDS) {
        const value = document.getElementById(`s_${f.key}`).value;
        await fetch(`${window.IKOCT_API_BASE_URL || 'http://localhost:4000/api'}/settings/${f.key}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${IkoctAPI.getToken()}` },
          body: JSON.stringify({ value }),
        });
      }
      showAlert('Settings saved.', 'success');
    } catch (err) {
      showAlert('Failed to save settings.', 'error');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Save Settings';
    }
  });

  init();
</script>
</body>
</html>
